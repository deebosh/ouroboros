# v7next domains manifest — module -> domain, 1:1, for THIS tree (upstream monoliths).
# Ф0 evidence artifact (plan §7.1; roast F17 discipline: report first, gate later).
#
# Derivation:
#   - domain vocabulary and 411-module assignment parsed from the frozen reference
#     worktree ouroboros_v7_wip @ 9f691656 docs/DOMAIN_MAP.md (per-domain Owners prose;
#     per-domain counts reproduce the map's index table exactly: 27/20/10/20/22/46/28/
#     38/12/27/38/13/6/43/15/8/17/10/11);
#   - monolith files of THIS tree keep the domain of their v7 facade; ledger-derived
#     leaves absent here are recorded in [split_pending] (MIGRATION_v7.md is the oracle);
#   - the 80 upstream modules absent from the v7 map are classified by reading each
#     header/docstring/imports and are listed in [classification].proposed — every such
#     row is a proposal for owner review, not a settled assignment.
#
# The seven package __init__.py files go with their package (DOMAIN_MAP Method note);
# ouroboros/gateways/__init__.py is placed with D07 (its residents split D06/D07 —
# claude_code.py is D06 transport, claudexor.py is D07).

